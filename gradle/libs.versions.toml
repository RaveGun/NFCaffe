[versions]
agp = "9.5.1"

core = "1.19.1"
activity = "1.13.0"
appcompat = "1.8.0"
material = "1.14.0"
constraintlayout = "2.2.2"
drawerlayout = "1.2.0"
documentfile = "1.1.0"
clansFab = "1.6.4"

junit = "4.13.2"
androidxTestExtJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
androidx-core = { module = "androidx.core:core", version.ref = "core" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-drawerlayout = { module = "androidx.drawerlayout:drawerlayout", version.ref = "drawerlayout" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }
# TODO(phase 4): replace with Material FABs and drop this unmaintained library.
clans-fab = { module = "com.github.clans:fab", version.ref = "clansFab" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
